<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<title>Phish-Tac-Toe · 1995 Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍩</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="donut">🍩</span>
    <div>
      <h1>Phish&#8209;Tac&#8209;Toe</h1>
      <p class="subtitle" id="showLine">1995 Night · MSG</p>
    </div>
  </div>
  <button class="status" id="statusPill" type="button" title="Tap to refresh now">
    <span class="dot"></span><span id="statusText">connecting…</span>
  </button>
</header>

<!-- Scoreboard: all three players, always visible -->
<nav class="scoreboard" id="scoreboard"></nav>

<main>
  <div class="boardhead">
    <button class="arrow" id="prevBtn" type="button" aria-label="Previous board">‹</button>
    <div class="whose">
      <h2 id="boardName">—</h2>
      <p id="boardStatus">—</p>
    </div>
    <button class="arrow" id="nextBtn" type="button" aria-label="Next board">›</button>
  </div>

  <div class="board" id="board"></div>

  <section class="setlist">
    <div class="setlist-head">
      <h3>Tonight's Setlist</h3>
      <span id="setlistCount">—</span>
    </div>
    <div class="legend" id="legend"></div>
    <div id="setlistBody" class="setlist-body"><p class="empty">Nothing played yet. Lights are still on.</p></div>
  </section>

  <footer class="foot">
    <button id="manualBtn" class="ghost" type="button">✍️ Manual entry</button>
    <button id="aboutBtn" class="ghost" type="button">ℹ️ How this works</button>
  </footer>
</main>

<!-- Song detail sheet -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <button class="close" id="sheetClose" type="button" aria-label="Close">✕</button>
    <div class="sheet-scroll">
      <div id="sheetBody"></div>
      <button class="sheet-done" type="button">Close</button>
    </div>
  </div>
</div>

<!-- Manual entry sheet -->
<div class="sheet-wrap" id="manualWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="close" id="manualClose" type="button" aria-label="Close">✕</button>
    <div class="sheet-scroll">
    <h3>Manual entry</h3>
    <p class="fine">If Phantasy Tour is lagging, mark squares yourself. These marks live only on <em>this</em> device and layer on top of the live feed — they never un-mark something the feed found.</p>
    <div id="manualList" class="manual-list"></div>
    <button id="manualReset" class="ghost danger" type="button">Clear all manual marks</button>
    <button class="sheet-done" type="button">Close</button>
    </div>
  </div>
</div>

<!-- About sheet -->
<div class="sheet-wrap" id="aboutWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="close" id="aboutClose" type="button" aria-label="Close">✕</button>
    <div class="sheet-scroll">
      <div id="aboutBody"></div>
      <button class="sheet-done" type="button">Close</button>
    </div>
  </div>
</div>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="logic.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
